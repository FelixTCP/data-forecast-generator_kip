name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check setup script syntax
        run: |
          bash -n scripts/setup.sh

      - name: Build Docker image
        run: |
          docker build -t data-forecast-generator:test .

      - name: Check runtime imports
        run: |
          docker run --rm data-forecast-generator:test python -c "import streamlit, polars, sklearn, joblib"

      - name: Check compose config
        env:
          GH_TOKEN: dummy
        run: |
          docker compose config
